<script>
/* demo 专用:?jump=N 直达 N 倍视口高(无头截图用,交付片段不含此段) */
(function () {
  var m = location.search.match(/[?&]jump=([\d.]+)/);
  if (!m) return;
  window.addEventListener('load', function () {
    setTimeout(function () { window.scrollTo(0, window.innerHeight * parseFloat(m[1])); }, 600);
  });
})();
</script>
