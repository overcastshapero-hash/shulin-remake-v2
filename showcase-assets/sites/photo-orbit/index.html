<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI PORTRAIT ARCHIVE® — 影像档案</title>
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --red: #E32B16;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    background: var(--white);
    color: var(--black);
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow-x: hidden; }
  body.locked { overflow: hidden; }
  ::selection { background: var(--black); color: var(--white); }

  /* ================= INTRO (mock previous chapter) ================= */
  #intro-section {
    position: relative; height: 100vh; height: 100svh;
    background: var(--black); color: var(--white);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 6vw 10vh;
    overflow: hidden;
  }
  #intro-section .chapter-no {
    font-size: clamp(90px, 16vw, 230px);
    font-weight: 800; line-height: .85; letter-spacing: -.02em;
    color: var(--red);
  }
  #intro-section .chapter-title {
    display: flex; align-items: baseline; gap: 3vw; flex-wrap: wrap;
    margin-top: 2vh;
  }
  #intro-section .chapter-title .zh {
    font-size: clamp(40px, 7vw, 96px); font-weight: 700; letter-spacing: .08em;
  }
  #intro-section .chapter-title .en {
    font-size: 12px; letter-spacing: .5em; opacity: .6;
  }
  #intro-section .intro-meta {
    margin-top: 4vh; display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; letter-spacing: .3em; opacity: .55;
  }
  #intro-section .intro-cue {
    position: absolute; bottom: 3.5vh; left: 50%; transform: translateX(-50%);
    font-size: 12px; animation: bob 1.8s ease-in-out infinite;
  }

  /* ================= DOME (sticky inside tall wrap) ================= */
  #dome-wrap { position: relative; height: 260vh; }
  #dome-section {
    position: sticky; top: 0; height: 100vh; height: 100svh;
    overflow: hidden; background: var(--white);
  }
  #stage { position: absolute; inset: 0; cursor: grab; touch-action: pan-y; }
  #stage.dragging { cursor: grabbing; }

  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 74% 74% at 50% 50%,
      rgba(255,255,255,0) 52%,
      rgba(255,255,255,.55) 79%,
      rgba(255,255,255,.96) 100%);
  }

  /* the dome wakes up out of the chapter's darkness */
  #veil {
    position: absolute; inset: 0; pointer-events: none; z-index: 20;
    background: var(--black); opacity: 1;
  }

  /* ---------- chrome ---------- */
  #chrome { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  #chrome .hot { pointer-events: auto; }

  .wordmark {
    position: absolute; top: 28px; left: 32px;
    font-weight: 700; font-size: 15px; letter-spacing: .14em;
  }
  .wordmark sup { font-size: 8px; vertical-align: super; }
  .wordmark small {
    display: block; margin-top: 6px;
    font-size: 10px; font-weight: 400; letter-spacing: .32em;
  }

  .filters {
    position: absolute; top: 30px; right: 32px;
    display: flex; gap: 26px;
    font-size: 11px; letter-spacing: .22em; font-weight: 500;
  }
  .filters button {
    background: none; border: none; cursor: pointer;
    font: inherit; letter-spacing: inherit; color: var(--black);
    padding: 2px 0 6px; position: relative; opacity: .35;
    transition: opacity .25s;
  }
  .filters button:hover { opacity: .75; }
  .filters button.on { opacity: 1; }
  .filters button.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--black);
  }
  .filters button i { font-style: normal; font-size: 9px; margin-left: 5px; opacity: .55; }

  .hint {
    position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .42em; text-indent: .42em; white-space: nowrap;
    opacity: 0; transition: opacity .8s;
  }
  .hint.show { opacity: .5; }

  .scroll-cue {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 13px; opacity: 0; transition: opacity .8s 1.2s;
    animation: bob 1.8s ease-in-out infinite;
  }
  .scroll-cue.show { opacity: .55; }
  @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 7px); } }

  .counter {
    position: absolute; bottom: 24px; right: 32px;
    font-size: 10px; letter-spacing: .2em; text-align: right; line-height: 1.7;
    opacity: .55;
  }

  /* ---------- the black anchor ball ---------- */
  #orb {
    position: absolute; left: 50%; top: 50%; z-index: 5;
    width: 150px; height: 150px;
    transform: translate(-50%, -50%);
    pointer-events: auto; cursor: pointer; user-select: none;
  }
  #orb .ball {
    position: absolute; inset: 9%;
    background: var(--black); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #orb .ball .label {
    color: var(--white); font-weight: 600;
    font-size: 13px; letter-spacing: .1em;
    transition: opacity .4s;
  }
  #orb svg.ring {
    position: absolute; inset: 0; width: 100%; height: 100%;
    animation: spin 14s linear infinite;
  }
  #orb svg.ring text {
    font-size: 7.5px; letter-spacing: .42em;
    fill: var(--black); font-weight: 600;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #orb:hover .ball { box-shadow: 0 0 0 6px rgba(0,0,0,.06); }

  /* ================= DETAIL VIEWER ================= */
  #viewer {
    position: fixed; inset: 0; z-index: 40;
    background: var(--white);
    opacity: 0; visibility: hidden;
  }
  #viewer .stagebox { position: absolute; inset: 0; }
  #viewer .frame {
    position: absolute; left: 0; top: 0;
    box-shadow: 0 24px 80px rgba(0,0,0,.16);
    will-change: transform; overflow: hidden;
  }
  #viewer .frame img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  #viewer .cap {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    display: flex; align-items: baseline; gap: 22px; white-space: nowrap;
  }
  #viewer .cap .no { font-size: 13px; font-weight: 700; letter-spacing: .18em; }
  #viewer .cap .tag {
    font-size: 10px; letter-spacing: .3em; padding: 4px 10px;
    border: 1px solid var(--black);
  }
  #viewer .cap .idx { font-size: 10px; letter-spacing: .2em; opacity: .45; }
  #viewer .x {
    position: absolute; top: 22px; right: 26px;
    width: 44px; height: 44px; border: none; background: none; cursor: pointer;
    font-size: 22px; line-height: 1; color: var(--black);
  }
  #viewer .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 54px; height: 54px; border: none; cursor: pointer;
    background: var(--black); color: var(--white);
    font-size: 17px; border-radius: 50%;
    transition: transform .2s;
  }
  #viewer .nav:hover { transform: translateY(-50%) scale(1.1); }
  #viewer .nav.prev { left: 28px; }
  #viewer .nav.next { right: 28px; }

  /* ================= WAVE (the only footer) ================= */
  #footer { position: relative; background: var(--white); }
  #wave {
    display: block; width: 100%; height: 20vh; min-height: 120px;
    margin-bottom: -1px;
  }
  #footer .strip {
    background: var(--black); color: var(--white);
    display: flex; justify-content: space-between; align-items: center;
    gap: 4vw; flex-wrap: wrap;
    padding: 5vh 6vw 6vh;
  }
  #footer .strip .copy {
    font-size: 10px; letter-spacing: .3em; opacity: .6; line-height: 2;
  }
  #footer .strip .f-top {
    border: 1px solid rgba(255,255,255,.4); background: none; color: var(--white);
    font-size: 10px; letter-spacing: .3em; padding: 13px 24px; cursor: pointer;
    transition: background .25s, color .25s;
  }
  #footer .strip .f-top:hover { background: var(--white); color: var(--black); }

  /* ================= responsive ================= */
  @media (max-width: 720px) {
    .wordmark { top: 18px; left: 18px; font-size: 12px; }
    .wordmark small { letter-spacing: .22em; font-size: 9px; }
    .filters { top: auto; bottom: 92px; right: 50%; transform: translateX(50%); gap: 20px; }
    .counter { display: none; }
    .hint { bottom: 50px; }
    #orb { width: 124px; height: 124px; }
    #viewer .nav { width: 42px; height: 42px; font-size: 14px; }
    #viewer .nav.prev { left: 10px; }
    #viewer .nav.next { right: 10px; }
    #viewer .cap { gap: 12px; bottom: 20px; }
  }

  #fallback {
    position: fixed; inset: 0; z-index: 90; background: var(--white);
    display: none; align-items: center; justify-content: center;
    font-size: 12px; letter-spacing: .3em;
  }
</style>
</head>
<body>

  <!-- ============ mock previous chapter ============ -->
  <section id="intro-section">
    <div class="chapter-no">01</div>
    <div class="chapter-title">
      <span class="zh">影像卷</span>
      <span class="en">PORTRAIT&nbsp;ARCHIVE&nbsp;—&nbsp;331&nbsp;WORKS</span>
    </div>
    <div class="intro-meta">
      <span>GENERATED&nbsp;BY&nbsp;STUDENTS&nbsp;×&nbsp;AI</span>
      <span>NO&nbsp;STUDIO&nbsp;·&nbsp;NO&nbsp;BUDGET&nbsp;·&nbsp;JUST&nbsp;PROMPTS</span>
    </div>
    <div class="intro-cue">↓</div>
  </section>

  <!-- ============ the dome (sticky, scroll-driven entrance) ============ -->
  <div id="dome-wrap">
    <section id="dome-section">
      <div id="stage"></div>
      <div id="vignette"></div>
      <div id="veil"></div>

      <div id="chrome">
        <div class="wordmark">
          AI&nbsp;PORTRAIT&nbsp;ARCHIVE<sup>®</sup>
          <small>大学生 AI 能力档案 · 影像卷</small>
        </div>

        <div class="filters hot">
          <button data-f="all" class="on">ALL <i id="c-all">—</i></button>
          <button data-f="f">SHE <i id="c-f">—</i></button>
          <button data-f="m">HE <i id="c-m">—</i></button>
        </div>

        <div class="hint" id="hint">拖 拽 旋 转 &nbsp;·&nbsp; 点 击 查 看</div>
        <div class="scroll-cue" id="scroll-cue">↓</div>

        <div class="counter" id="counter">
          <span id="counter-line">— WORKS</span><br>
          GENERATED&nbsp;BY&nbsp;STUDENTS
        </div>
      </div>

      <div id="orb">
        <svg class="ring" viewBox="0 0 100 100">
          <defs><path id="ringpath" d="M 50,50 m -46,0 a 46,46 0 1,1 92,0 a 46,46 0 1,1 -92,0"/></defs>
          <text><textPath href="#ringpath" id="ringtext">AI PORTRAIT ARCHIVE · STUDENT WORKS · DRAG TO ORBIT · CLICK TO VIEW · </textPath></text>
        </svg>
        <div class="ball"><span class="label" id="orb-label">…</span></div>
      </div>
    </section>
  </div>

  <!-- ============ the wave ============ -->
  <footer id="footer">
    <svg id="wave" viewBox="0 0 1440 160" preserveAspectRatio="none" aria-hidden="true">
      <path id="wave-path" fill="#000000" d="M0,160 L0,80 L1440,80 L1440,160 Z"></path>
    </svg>
    <div class="strip">
      <span class="copy">© 2026 AI PORTRAIT ARCHIVE® — GENERATED BY STUDENTS × AI</span>
      <button class="f-top" id="back-top">BACK&nbsp;TO&nbsp;TOP&nbsp;↑</button>
    </div>
  </footer>

  <div id="viewer">
    <div class="stagebox" id="viewer-box"></div>
    <button class="x" id="viewer-x" aria-label="close">✕</button>
    <button class="nav prev" id="viewer-prev" aria-label="prev">←</button>
    <button class="nav next" id="viewer-next" aria-label="next">→</button>
    <div class="cap">
      <span class="no" id="cap-no">NO. —</span>
      <span class="tag" id="cap-tag">—</span>
      <span class="idx" id="cap-idx">—</span>
    </div>
  </div>

  <div id="fallback">该浏览器不支持 WEBGL</div>

  <script src="./vendor/gsap.min.js"></script>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./app.js"></script>
<script>
// embed 模式(?embed=1,被主站 iframe 嵌入时):滚轮回传父页,内部滚动由父页驱动;独立打开不受影响
(function () {
  if (!/[?&]embed=1/.test(location.search)) return;
  document.documentElement.classList.add('is-embed');
  window.addEventListener('wheel', function (e) {
    var fwd = null;
    try { fwd = window.parent && window.parent.__v2Scroll; } catch (err) { fwd = null; }
    if (fwd) { e.preventDefault(); fwd(e.deltaY); }
    // 父页不可达(file:// 直开等):不拦截,保留 iframe 内原生滚动
  }, { passive: false });
})();
</script>
</body>
</html>
